# Fuzz target for the BiDi client's frame parser, which reads whatever a
# browser's endpoint sends. libFuzzer needs a nightly Rust, so this crate is
# its own workspace: the pinned toolchain, cargo deny and cargo shear never see it.
[package]
name = "eidolon-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
eidolon = { path = "../crates/eidolon", features = ["browser"] }

[[bin]]
name = "bidi_frame"
path = "fuzz_targets/bidi_frame.rs"
test = false
doc = false
bench = false
