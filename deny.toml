# What `cargo deny check` holds the dependencies to: known advisories,
# licenses that fit MIT, no wildcards, and crates only from crates.io.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
# Every RustSec advisory fails the check: vulnerable, unsound, unmaintained
# or yanked. An exception goes in `ignore` with its reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa comes with age's ssh feature; Eidolon only encrypts to an ssh-rsa extra recipient and never decrypts with an RSA key, where the timing leak is" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint comes with p256 in age for tag and plugin recipients, used on public keys only; machine keys are Ed25519" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml reads age's translation config at build time; no safe upgrade until age moves off it" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant comes with keyring's Linux Secret Service store; no maintained replacement in keyring 4 yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, as zvariant" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, as zvariant" },
]

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause"]

[licenses.private]
# The workspace's own crates aren't published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
