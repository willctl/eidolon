[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["willctl"]
repository = "https://github.com/willctl/eidolon"
publish = false

[workspace.dependencies]
eidolon = { path = "crates/eidolon" }
# Adytum keeps the cells, XenoNet's crates sign and store keys. Both are
# pinned to a commit on their main.
adytum = { git = "https://github.com/willctl/adytum", rev = "a1d58a88439b4654c26552a0beef89dd57a07ee9", default-features = false, features = ["lima"] }
xenonet-id = { git = "https://github.com/willctl/xenonet", rev = "16964d348f0ac58941c9610f286103279eab64eb" }
xenonet-os = { git = "https://github.com/willctl/xenonet", rev = "16964d348f0ac58941c9610f286103279eab64eb" }
xenonet-text = { git = "https://github.com/willctl/xenonet", rev = "16964d348f0ac58941c9610f286103279eab64eb" }
base64 = "0.23"
flate2 = "1"
getrandom = "0.3"
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
ring = "0.17"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "sync", "process", "signal", "fs"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 4

# A published binary: the whole program optimized as one unit, without symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"

# Each crate takes these with `[lints] workspace = true`, and CI fails on any
# warning. An exception says why with #[expect(lint, reason = "...")].
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
# The default groups (correctness, suspicious, style, complexity, perf) and
# pedantic, less the pedantic checks below that are taste rather than bugs.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
unreadable_literal = "allow"
single_match_else = "allow"
if_not_else = "allow"
match_same_arms = "allow"
implicit_hasher = "allow"
# Sizes, offsets and counts are converted with intent, and floats are
# compared exactly where a value was just stored.
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Nothing a person or a file can reach may panic. Tests may (clippy.toml).
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# stdout is the MCP protocol and the command's output; stderr is the log.
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
# #[expect] rather than #[allow], so an exception no longer needed shows,
# and each one says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
