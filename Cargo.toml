[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["willctl"]
repository = "https://github.com/willctl/eidolon"
publish = false

[workspace.dependencies]
eidolon = { path = "crates/eidolon" }
# The bundle's encryption, opened by stock `age`. Pinned: 0.13 changes its
# crypto dependencies. `ssh` makes each machine's Ed25519 key a recipient,
# `plugin` lets extra recipients live on a YubiKey or a Secure Enclave.
age = { version = "=0.12.1", default-features = false, features = ["ssh", "plugin"] }
# The command line.
clap = { version = "4.6", features = ["derive"] }
# Include and exclude rules of a target.
globset = { version = "0.4.18", default-features = false }
# The machine key in the operating system's key store.
keyring = "4.2"
# The app's own lock (fcntl on Unix), held while a target is read or replaced.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hash a seat names its bundle by.
sha2 = "0.10"
# Each machine's key, and SSHSIG seats that `ssh-keygen -Y verify` checks.
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rand_core", "getrandom"] }
# The bundle's archive. 0.4.45 fixed RUSTSEC-2026-0067 and -0068.
tar = { version = "0.4.46", default-features = false }
# Targets are TOML.
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "std"] }
# The bundle's compression.
zstd = { version = "0.14", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

# A published binary: the whole program optimized as one unit, without symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"

# Each crate takes these with `[lints] workspace = true`, and CI fails on any
# warning. An exception says why with #[expect(lint, reason = "...")].
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
similar_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
if_not_else = "allow"
match_same_arms = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# stdout carries the command's output and the move's answer; stderr is the log.
print_stdout = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
