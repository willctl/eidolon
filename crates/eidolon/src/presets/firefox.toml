about = "A Firefox profile folder: sign-ins, cookies, history, settings and add-ons. Firefox must be closed."

include = ["**"]

# Regenerated by Firefox, downloaded again, or only telemetry and crash data.
exclude = [
  "cache2",
  "startupCache",
  "shader-cache",
  "thumbnails",
  "safebrowsing",
  "OfflineCache",
  "storage/temporary",
  "crashes",
  "minidumps",
  "datareporting",
  "saved-telemetry-pings",
  "gmp-*",
  "lock",
  ".parentlock",
  "parent.lock",
  "*.tmp",
]

[closed]
app = "Firefox"
unix_lock = ".parentlock"
windows_lock = "parent.lock"
