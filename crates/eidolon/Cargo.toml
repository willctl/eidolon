[package]
name = "eidolon"
description = "An entity's state (a folder, a signed-in Firefox profile) kept sealed, opened in an Adytum cell, and moved between machines."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Driving the browser: the BiDi client, the sign-in window and the agent tools.
browser = ["dep:base64", "dep:getrandom", "dep:rmcp", "dep:schemars"]
# Fakes for tests, and the abort points the kill tests stop the process at.
testing = ["browser", "adytum/testing"]

[dependencies]
# The cells, all reached through `cell.rs`.
adytum.workspace = true
base64 = { workspace = true, optional = true }
flate2.workspace = true
getrandom = { workspace = true, optional = true }
# O_NOFOLLOW for creating files while unpacking.
libc.workspace = true
ring.workspace = true
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
x25519-dalek.workspace = true
xenonet-id.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
# A paused clock, for tests of what waits between asks.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "facet"
required-features = ["testing"]

[[test]]
name = "bidi"
required-features = ["testing"]

[[test]]
name = "fake_bidi"
required-features = ["testing"]

[[test]]
name = "browser_connection"
required-features = ["testing"]

[[test]]
name = "plan"
required-features = ["testing"]

[[test]]
name = "mcp"
required-features = ["testing"]

[[test]]
name = "view"
required-features = ["testing"]

[[test]]
name = "agent_live"
required-features = ["testing"]

[lints]
workspace = true
