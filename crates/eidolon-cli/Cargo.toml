[package]
name = "eidolon-cli"
description = "The eidolon command, with --json on every command."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "eidolon"
path = "src/main.rs"

[dependencies]
eidolon = { workspace = true, features = ["browser"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The tests record their cells in a ledger of their own; the live ones make real VMs.
adytum.workspace = true
# The binary the tests run reads EIDOLON_TEST_CELLS and stops at the kill tests' steps.
eidolon = { workspace = true, features = ["testing"] }
xenonet-id.workspace = true

[lints]
workspace = true
